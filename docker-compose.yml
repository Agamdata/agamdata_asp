services:
  ai-service:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/aiservice
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      CHROMA_PERSIST_PATH: /chroma/data
    depends_on: [postgres, redis, minio]
    volumes:
      - "./app:/app/app"
      - "chroma_data:/chroma/data"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://user:pass@postgres:5432/aiservice
      REDIS_URL: redis://redis:6379/0
      CHROMA_PERSIST_PATH: /chroma/data
    depends_on: [redis, postgres]
    volumes:
      # Mount source for dev-parity with ai-service (I-RAG-01, 2026-04-18).
      # Previously absent — celery-worker ran from the baked image while
      # ai-service ran from the mount, producing silent code-drift during
      # development. This mount does not change production packaging.
      - "./app:/app/app"
      - "chroma_data:/chroma/data"
    command: celery -A app.worker worker --loglevel=info --concurrency=4

  flower:
    build: .
    ports: ["5555:5555"]
    environment: { CELERY_BROKER_URL: "redis://redis:6379/0" }
    depends_on: [redis]
    command: celery -A app.worker flower --port=5555

  postgres:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: user, POSTGRES_PASSWORD: pass, POSTGRES_DB: aiservice }
    ports: ["5434:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    ports: ["9000:9000", "9001:9001"]
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    command: server /data --console-address ":9001"
    volumes: ["minio_data:/data"]

volumes: { pg_data: {}, minio_data: {}, chroma_data: {} }
